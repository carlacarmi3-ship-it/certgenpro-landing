<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Berhasil — CertGen PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue-900:#0B1D3A;--blue-700:#1A4080;--blue-600:#1E56AE;--blue-500:#2563EB;
      --blue-400:#3B82F6;--blue-200:#BFDBFE;--blue-100:#DBEAFE;--blue-50:#EFF6FF;
      --gray-900:#0F172A;--gray-700:#334155;--gray-600:#475569;--gray-500:#64748B;
      --gray-400:#94A3B8;--gray-200:#E2E8F0;--gray-100:#F1F5F9;--gray-50:#F8FAFC;
      --white:#FFFFFF;--green:#10B981;--green-light:#ECFDF5;--green-border:#A7F3D0;
      --gold:#F59E0B;--sky:#0EA5E9;
      --radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-xl:28px;
      --shadow-md:0 4px 16px rgba(0,0,0,0.10);--shadow-xl:0 24px 64px rgba(0,0,0,0.18);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2rem 1rem;}
    
    .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;color:var(--blue-600);margin-bottom:2rem;text-decoration:none;}
    .brand-badge{background:var(--blue-600);color:white;font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:100px;letter-spacing:0.08em;text-transform:uppercase;}
    
    .success-icon{width:80px;height:80px;border-radius:50%;background:var(--green-light);border:3px solid var(--green-border);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 1.25rem;animation:bounceIn 0.6s ease both;}
    @keyframes bounceIn{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
    
    .card{background:white;border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);padding:2.5rem;max-width:560px;width:100%;animation:fadeUp 0.5s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    
    .page-title{font-size:1.6rem;font-weight:800;color:var(--gray-900);text-align:center;margin-bottom:0.4rem;letter-spacing:-0.03em;}
    .page-title em{font-family:'Instrument Serif',serif;font-style:italic;color:var(--blue-600);}
    .page-sub{text-align:center;font-size:0.9rem;color:var(--gray-500);margin-bottom:2rem;line-height:1.6;}
    
    /* Order Detail Box */
    .detail-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:1.25rem;margin-bottom:1.5rem;}
    .detail-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-500);margin-bottom:0.85rem;}
    .detail-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding:0.45rem 0;border-bottom:1px solid var(--gray-200);}
    .detail-row:last-child{border-bottom:none;}
    .detail-row .label{font-size:0.85rem;color:var(--gray-600);}
    .detail-row .value{font-size:0.85rem;font-weight:600;color:var(--gray-900);text-align:right;}
    .value.green{color:var(--green);display:flex;align-items:center;gap:5px;}
    .value.blue{color:var(--blue-600);}
    
    /* Delivery Status */
    .delivery-section{margin-bottom:1.5rem;}
    .delivery-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-500);margin-bottom:0.75rem;}
    .delivery-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--green-light);border:1px solid var(--green-border);margin-bottom:0.5rem;}
    .delivery-icon{font-size:1.1rem;flex-shrink:0;}
    .delivery-text{flex:1;}
    .delivery-text strong{display:block;font-size:0.875rem;color:var(--gray-900);}
    .delivery-text span{font-size:0.8rem;color:var(--gray-600);}
    .delivery-check{color:var(--green);font-size:1rem;font-weight:700;}
    
    /* Key Box */
    .key-box{background:var(--blue-50);border:1.5px dashed var(--blue-400);border-radius:var(--radius-md);padding:1.25rem;text-align:center;margin-bottom:1.5rem;}
    .key-label{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--blue-600);margin-bottom:0.5rem;}
    .key-value{font-family:monospace;font-size:1.3rem;font-weight:800;color:var(--blue-700);letter-spacing:0.1em;margin-bottom:0.35rem;}
    .key-note{font-size:0.78rem;color:var(--blue-600);}
    
    /* Download Buttons */
    .download-section{margin-bottom:1.75rem;}
    .download-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-500);margin-bottom:0.75rem;}
    .btn-download{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius-md);text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;width:100%;margin-bottom:0.6rem;font-family:'Plus Jakarta Sans',sans-serif;}
    .btn-download.primary{background:var(--blue-600);color:white;font-weight:700;font-size:0.95rem;box-shadow:0 4px 16px rgba(37,99,235,0.3);}
    .btn-download.primary:hover{background:var(--blue-700);transform:translateY(-1px);}
    .btn-download.secondary{background:var(--gray-100);color:var(--gray-700);font-weight:600;font-size:0.9rem;border:1px solid var(--gray-200);}
    .btn-download.secondary:hover{background:var(--gray-200);}
    .btn-download-icon{font-size:1.3rem;flex-shrink:0;}
    .btn-download-text{flex:1;text-align:left;}
    .btn-download-title{display:block;font-weight:700;}
    .btn-download-sub{display:block;font-size:0.75rem;opacity:0.75;}
    
    /* Activation Guide */
    .guide-section{background:var(--blue-900);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.5rem;color:white;}
    .guide-title{font-size:0.85rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
    .guide-steps{list-style:none;display:flex;flex-direction:column;gap:0.6rem;}
    .guide-step{display:flex;align-items:flex-start;gap:10px;font-size:0.85rem;color:rgba(255,255,255,0.85);}
    .guide-step-num{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;margin-top:1px;}
    
    /* Support */
    .support-section{text-align:center;padding-top:1.25rem;border-top:1px solid var(--gray-200);}
    .support-section p{font-size:0.85rem;color:var(--gray-600);margin-bottom:0.75rem;}
    .btn-wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:white;padding:10px 22px;border-radius:var(--radius-md);font-size:0.875rem;font-weight:700;text-decoration:none;transition:all 0.2s;}
    .btn-wa:hover{background:#20BC5A;transform:translateY(-1px);}
    
    /* Loading State */
    .loading-state{text-align:center;padding:3rem 0;}
    .spinner{display:inline-block;width:36px;height:36px;border:3.5px solid var(--gray-200);border-top-color:var(--blue-600);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:1rem;}
    @keyframes spin{to{transform:rotate(360deg);}}
    
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--gray-500);font-size:0.85rem;text-decoration:none;margin-top:1.5rem;}
    .back-link:hover{color:var(--blue-600);}
  </style>
</head>
<body>

  <a href="/" class="brand">CertGen <span class="brand-badge">PRO</span></a>

  <div class="card" id="mainCard">
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="color:var(--gray-500);font-size:0.9rem;">Memuat detail pesanan Anda...</p>
    </div>
  </div>

  <a href="/" class="back-link">← Kembali ke Beranda</a>

<script>
  const API_URL = '';
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order_id');

  async function loadOrderDetail() {
    const card = document.getElementById('mainCard');

    if (!orderId) {
      card.innerHTML = buildErrorState('Order ID tidak ditemukan.', 'Pastikan Anda mengakses halaman ini dari redirect pembayaran yang valid.');
      return;
    }

    // Polling sampai status paid (maks 30 detik)
    let attempts = 0;
    let order = null;

    while (attempts < 10) {
      try {
        const res = await fetch(`${API_URL}/api/check-order?order_id=${orderId}`);
        const data = await res.json();
        if (data && data.status === 'paid') {
          order = data; break;
        }
      } catch {}
      attempts++;
      await new Promise(r => setTimeout(r, 3000));
    }

    if (!order) {
      // Tampilkan halaman thank you tanpa detail real-time
      card.innerHTML = buildSuccessState({
        order_id: orderId,
        customer_name: 'Pembeli',
        customer_email: '-',
        paket: '-',
        amount: 0,
        license_key: 'Cek email Anda',
        email_sent: true,
        wa_sent: true
      });
      return;
    }

    card.innerHTML = buildSuccessState(order);
  }

  function buildSuccessState(order) {
    const price = order.amount ? `Rp ${parseInt(order.amount).toLocaleString('id-ID')}` : '-';
    const licKey = order.license_key || 'Dikirim via email';

    return `
      <div class="success-icon">✓</div>
      <h1 class="page-title">Pembayaran <em>Berhasil!</em></h1>
      <p class="page-sub">Terima kasih, <strong>${order.customer_name}</strong>! License Key Anda sudah dikirim.</p>

      <div class="detail-box">
        <div class="detail-title">Detail Pesanan</div>
        <div class="detail-row"><span class="label">Order ID</span><span class="value blue">${order.order_id}</span></div>
        <div class="detail-row"><span class="label">Paket</span><span class="value">${order.paket || '-'}</span></div>
        <div class="detail-row"><span class="label">Total Bayar</span><span class="value">${price}</span></div>
        <div class="detail-row"><span class="label">Email</span><span class="value">${order.customer_email || '-'}</span></div>
        <div class="detail-row"><span class="label">Status</span><span class="value green">✓ Lunas</span></div>
      </div>

      <div class="key-box">
        <div class="key-label">🔑 License Key Anda</div>
        <div class="key-value" id="licenseKeyDisplay">${licKey}</div>
        <div class="key-note">Simpan License Key ini dengan aman. Jangan bagikan ke orang lain.</div>
      </div>

      <div class="delivery-section">
        <div class="delivery-title">Status Pengiriman</div>
        <div class="delivery-item">
          <div class="delivery-icon">📧</div>
          <div class="delivery-text">
            <strong>Email Terkirim</strong>
            <span>License Key + link download dikirim ke ${order.customer_email || 'email Anda'}</span>
          </div>
          <div class="delivery-check">✓</div>
        </div>
        <div class="delivery-item">
          <div class="delivery-icon">💬</div>
          <div class="delivery-text">
            <strong>WhatsApp Terkirim</strong>
            <span>License Key + panduan aktivasi dikirim ke WA Anda</span>
          </div>
          <div class="delivery-check">✓</div>
        </div>
      </div>

      <div class="download-section">
        <div class="download-title">📥 Download Aplikasi</div>
        <a href="${window.DOWNLOAD_URL || '#'}" class="btn-download primary" id="btnDownload">
          <div class="btn-download-icon">⬇️</div>
          <div class="btn-download-text">
            <span class="btn-download-title">Download CertGen PRO</span>
            <span class="btn-download-sub">Link utama · Windows 10/11 64-bit</span>
          </div>
        </a>
        <a href="${window.DOWNLOAD_MIRROR || '#'}" class="btn-download secondary" id="btnMirror">
          <div class="btn-download-icon">🔗</div>
          <div class="btn-download-text">
            <span class="btn-download-title">Mirror Download</span>
            <span class="btn-download-sub">Gunakan jika link utama lambat</span>
          </div>
        </a>
      </div>

      <div class="guide-section">
        <div class="guide-title">📋 Panduan Aktivasi</div>
        <ul class="guide-steps">
          <li class="guide-step"><div class="guide-step-num">1</div>Download dan jalankan installer CertGen PRO</li>
          <li class="guide-step"><div class="guide-step-num">2</div>Buka aplikasi → klik "Aktivasi Lisensi"</li>
          <li class="guide-step"><div class="guide-step-num">3</div>Masukkan License Key yang dikirim ke email Anda</li>
          <li class="guide-step"><div class="guide-step-num">4</div>Klik "Aktifkan" → aplikasi siap digunakan!</li>
        </ul>
      </div>

      <div class="support-section">
        <p>Ada pertanyaan atau kendala aktivasi? Hubungi support kami:</p>
        <a href="https://wa.me/6281234567890?text=Halo, saya butuh bantuan aktivasi CertGen PRO. Order ID: ${order.order_id}" class="btn-wa" target="_blank">
          💬 Chat via WhatsApp
        </a>
      </div>
    `;
  }

  function buildErrorState(title, msg) {
    return `
      <div style="text-align:center; padding: 2rem 0;">
        <div style="font-size:3rem; margin-bottom:1rem;">⚠️</div>
        <h2 style="font-size:1.3rem; font-weight:700; margin-bottom:0.5rem;">${title}</h2>
        <p style="font-size:0.9rem; color:var(--gray-600); margin-bottom:1.5rem;">${msg}</p>
        <a href="/" style="color:var(--blue-600); font-weight:600; text-decoration:none;">← Kembali ke Beranda</a>
      </div>
    `;
  }

  // Load download links from API
  async function loadDownloadLinks() {
    try {
      const res = await fetch(`${API_URL}/api/get-download-links`);
      const data = await res.json();
      window.DOWNLOAD_URL = data.primary || '#';
      window.DOWNLOAD_MIRROR = data.mirror || '#';
    } catch {}
  }

  loadDownloadLinks().then(() => loadOrderDetail());
</script>
</body>
</html>
