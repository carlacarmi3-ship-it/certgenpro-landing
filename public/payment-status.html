<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Pembayaran — CertGen PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--blue-600:#1E56AE;--blue-50:#EFF6FF;--gray-900:#0F172A;--gray-600:#475569;--gray-500:#64748B;--gray-200:#E2E8F0;--gray-50:#F8FAFC;--green:#10B981;--gold:#F59E0B;--red:#EF4444;--radius-xl:28px;--shadow-xl:0 24px 64px rgba(0,0,0,0.18);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--gray-50);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
    .card{background:white;border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center;}
    .status-icon{font-size:3.5rem;margin-bottom:1rem;}
    h1{font-size:1.6rem;font-weight:800;margin-bottom:0.5rem;}
    p{font-size:0.9rem;color:var(--gray-600);line-height:1.7;margin-bottom:1.5rem;}
    .detail-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;padding:1rem 1.25rem;text-align:left;margin-bottom:1.5rem;}
    .detail-row{display:flex;justify-content:space-between;font-size:0.85rem;padding:0.35rem 0;border-bottom:1px solid var(--gray-200);}
    .detail-row:last-child{border-bottom:none;}
    .detail-label{color:var(--gray-600);}
    .detail-value{font-weight:600;}
    .btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:0.95rem;font-weight:700;border:none;cursor:pointer;margin-bottom:0.6rem;text-decoration:none;transition:all 0.2s;}
    .btn-primary{background:var(--blue-600);color:white;}
    .btn-primary:hover{opacity:0.9;}
    .btn-secondary{background:var(--gray-200);color:var(--gray-900);}
    .btn-secondary:hover{background:var(--gray-300);}
    .logo{font-weight:800;font-size:1rem;color:var(--blue-600);text-decoration:none;display:block;margin-bottom:2rem;}
    .spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <a href="/" class="logo">CertGen <span style="background:var(--blue-600);color:white;font-size:0.6rem;padding:2px 7px;border-radius:100px;margin-left:4px;">PRO</span></a>
  <div class="card" id="mainCard">
    <div class="status-icon">⏳</div>
    <h1>Memuat Status...</h1>
    <p>Mohon tunggu sebentar.</p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status') || 'pending';
  const orderId = params.get('order_id') || '';
  const card = document.getElementById('mainCard');

  if (status === 'pending') {
    card.innerHTML = `
      <div class="status-icon">⏳</div>
      <h1 style="color:var(--gold);">Pembayaran Pending</h1>
      <p>Pembayaran Anda sedang dalam proses. Silakan selesaikan pembayaran sesuai instruksi yang dikirim ke email Anda.</p>
      ${orderId ? `<div class="detail-box"><div class="detail-row"><span class="detail-label">Order ID</span><span class="detail-value">${orderId}</span></div></div>` : ''}
      <p style="font-size:0.82rem;">Setelah pembayaran berhasil dikonfirmasi, License Key akan dikirim otomatis ke email dan WhatsApp Anda. Proses biasanya memakan waktu beberapa menit.</p>
      <a href="/" class="btn btn-primary" style="margin-top:1rem;">← Kembali ke Beranda</a>
      <button class="btn btn-secondary" onclick="checkStatus()"><span class="spinner" id="checkSpinner" style="display:none;"></span>Cek Status Pembayaran</button>
    `;
  } else if (status === 'error') {
    card.innerHTML = `
      <div class="status-icon">❌</div>
      <h1 style="color:var(--red);">Pembayaran Gagal</h1>
      <p>Pembayaran tidak berhasil diproses. Tidak ada biaya yang dikenakan pada transaksi ini.</p>
      ${orderId ? `<div class="detail-box"><div class="detail-row"><span class="detail-label">Order ID</span><span class="detail-value">${orderId}</span></div></div>` : ''}
      <a href="/" class="btn btn-primary" style="margin-top:1rem;">Coba Lagi</a>
      <a href="https://wa.me/6281234567890" class="btn btn-secondary" target="_blank">💬 Hubungi Support</a>
    `;
  } else {
    card.innerHTML = `
      <div class="status-icon">✅</div>
      <h1 style="color:var(--green);">Pembayaran Berhasil!</h1>
      <p>Pembayaran Anda berhasil. License Key sedang diproses dan akan segera dikirim.</p>
      <a href="/thank-you.html?order_id=${orderId}" class="btn btn-primary" style="margin-top:1rem;">Lihat Detail Pesanan →</a>
    `;
  }

  async function checkStatus() {
    if (!orderId) return;
    const spinner = document.getElementById('checkSpinner');
    if (spinner) spinner.style.display = 'inline-block';
    try {
      const res = await fetch(`/api/check-order?order_id=${orderId}`);
      const data = await res.json();
      if (data.status === 'paid') {
        window.location.href = `/thank-you.html?order_id=${orderId}`;
      } else {
        alert('Pembayaran belum dikonfirmasi. Coba beberapa saat lagi.');
      }
    } catch {
      alert('Gagal mengecek status. Coba lagi.');
    }
    if (spinner) spinner.style.display = 'none';
  }
</script>
</body>
</html>
