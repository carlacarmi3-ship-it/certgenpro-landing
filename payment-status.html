<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Pembayaran — CertGen Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #2a2a38;
      --accent: #5b6ef5;
      --accent2: #8b5cf6;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e8e8f0;
      --muted: #888899;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    h1 { font-family: 'Syne', sans-serif; }

    .status-circle {
      width: 88px; height: 88px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 32px;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .status-circle.pending {
      background: rgba(245,158,11,0.15);
      border: 2px solid var(--warning);
    }
    .status-circle.error {
      background: rgba(239,68,68,0.15);
      border: 2px solid var(--danger);
    }
    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.5s 0.1s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
    .sub { color: var(--muted); font-size: 15px; font-weight: 300; margin-bottom: 32px; line-height: 1.7; }

    .status-info {
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 28px;
      text-align: left;
      font-size: 14px;
      line-height: 1.7;
    }
    .status-info.pending {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.25);
      color: #fbbf24;
    }
    .status-info.error {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    .order-id-display {
      font-family: monospace;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 28px;
      word-break: break-all;
      color: var(--muted);
    }
    .order-id-display strong { color: var(--text); }

    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 13px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 13px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    .disclaimer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    @media (max-width: 520px) { .card { padding: 32px 20px; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="status-circle" id="status-circle">⏳</div>
    <h1 id="status-title">Memuat Status...</h1>
    <p class="sub" id="status-sub">Mohon tunggu sebentar.</p>

    <div id="order-display" class="order-id-display" style="display:none;">
      Order ID: <strong id="order-id-text">-</strong>
    </div>

    <div class="status-info pending" id="status-detail" style="display:none;"></div>

    <div class="btn-group" id="btn-group" style="margin-top:8px;">
      <a href="/" class="btn-primary">← Kembali ke Beranda</a>
    </div>
    <p class="disclaimer" id="disclaimer"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const orderId = params.get('order_id');

    const circle = document.getElementById('status-circle');
    const title = document.getElementById('status-title');
    const sub = document.getElementById('status-sub');
    const detail = document.getElementById('status-detail');
    const disclaimer = document.getElementById('disclaimer');
    const btnGroup = document.getElementById('btn-group');

    if (orderId) {
      document.getElementById('order-id-text').textContent = orderId;
      document.getElementById('order-display').style.display = 'block';
    }

    if (status === 'pending') {
      circle.classList.add('pending');
      circle.textContent = '⏳';
      title.textContent = 'Pembayaran Menunggu Konfirmasi';
      sub.textContent = 'Pembayaran Anda sedang diverifikasi. Ini biasanya memerlukan beberapa menit.';
      detail.style.display = 'block';
      detail.classList.remove('error');
      detail.classList.add('pending');
      detail.innerHTML = `
        ⚠️ <strong>Yang perlu Anda lakukan:</strong><br>
        Jika Anda membayar via transfer bank, pastikan transfer telah dikonfirmasi. 
        Lisensi akan dikirim otomatis setelah pembayaran terverifikasi. 
        Cek email dan WhatsApp Anda dalam 1×24 jam.
      `;
      disclaimer.textContent = 'Butuh bantuan? Hubungi support kami via WhatsApp dengan menyertakan Order ID di atas.';
    } else if (status === 'error') {
      circle.classList.add('error');
      circle.textContent = '✕';
      title.textContent = 'Pembayaran Gagal';
      sub.textContent = 'Maaf, pembayaran Anda tidak berhasil diproses. Tidak ada biaya yang ditarik.';
      detail.style.display = 'block';
      detail.classList.remove('pending');
      detail.classList.add('error');
      detail.innerHTML = `
        ❌ <strong>Kemungkinan penyebab:</strong><br>
        Saldo tidak cukup, transaksi dibatalkan, atau koneksi terputus. 
        Silakan coba kembali atau gunakan metode pembayaran lain.
      `;
      btnGroup.innerHTML = `
        <a href="/#pricing" class="btn-primary">Coba Lagi</a>
        <a href="/" class="btn-ghost">Kembali ke Beranda</a>
      `;
      disclaimer.textContent = 'Jika saldo terpotong namun pembayaran gagal, hubungi support kami segera.';
    } else {
      // Status tidak dikenal
      circle.classList.add('pending');
      circle.textContent = '❓';
      title.textContent = 'Status Tidak Diketahui';
      sub.textContent = 'Kami tidak dapat menentukan status pembayaran Anda saat ini.';
      disclaimer.textContent = 'Hubungi support kami dengan menyertakan Order ID untuk bantuan lebih lanjut.';
    }
  </script>
</body>
</html>
